<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">Data Integrity Bot: Salesforce CPQ to Zuora reconciliation</title>
<desc id="d">Two columns of contract lines, Salesforce CPQ (sold) and Zuora (billed), matched row by row. Four mismatches are flagged and classified as pricing, proration, discount, and contract-math errors. Saved annually in production: $2 to 3M per year. Illustrative rows, not customer data.</desc>
