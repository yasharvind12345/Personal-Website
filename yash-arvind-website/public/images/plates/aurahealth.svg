<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">AuraHealth: AI follow-up call, urgency triage, and escalation</title>
<desc id="d">An excerpt of a follow-up call between the AuraHealth agent and a patient three days after a procedure. The patient reports a warm, red incision and a fever of 101.8 degrees. Triage rates the call on a low, medium, high scale as high, and the agent escalates by SMS to the doctor. Illustrative call, not patient data.</desc>
<style>
  .m { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-feature-settings: 'tnum'; }
  .s { font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-stretch: 118%; }
  .t { font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .cap { text-transform: uppercase; letter-spacing: 1.6px; }
</style>
<rect width="1600" height="1000" fill="#F4F1EA"/>
<text class="m cap" x="80" y="92" font-size="15" fill="#5E5B54">AuraHealth · Follow-up call</text>
<text class="m cap" x="1520" y="92" font-size="15" fill="#5E5B54" text-anchor="end">CheeseHacks 2026 · Fig. 01</text>
<line x1="80" y1="118.5" x2="1520" y2="118.5" stroke="#111110" stroke-width="1"/>

<!-- Transcript -->
<text class="s" x="80" y="186" font-size="28" font-weight="600" letter-spacing="-0.6" fill="#111110">Follow-up call</text>
<text class="m cap" x="960" y="186" font-size="12.5" fill="#5E5B54" text-anchor="end">Post-op · day 3</text>
<line x1="80" y1="213.5" x2="960" y2="213.5" stroke="#111110" stroke-width="1.5"/>

<text class="m" x="90" y="262" font-size="14" fill="#5E5B54">00:04</text>
<text class="m cap" x="160" y="262" font-size="12.5" fill="#5E5B54">Agent</text>
<text class="t" x="290" y="262" font-size="21" fill="#111110">Hi, this is AuraHealth calling for your follow-up after</text>
<text class="t" x="290" y="292" font-size="21" fill="#111110">Tuesday’s visit. How is the incision healing?</text>
<line x1="80" y1="320.5" x2="960" y2="320.5" stroke="#D9D4C7" stroke-width="1"/>

<rect x="80" y="321" width="880" height="98" fill="#EAE6DC"/>
<text class="m" x="90" y="362" font-size="14" fill="#5E5B54">00:12</text>
<text class="m cap" x="160" y="362" font-size="12.5" fill="#111110">Patient</text>
<text class="t" x="290" y="362" font-size="21" fill="#111110">It’s more swollen than yesterday, and it’s <tspan fill="#FF4F00">warm and red</tspan></text>
<text class="t" x="290" y="392" font-size="21" fill="#FF4F00">around the stitches.</text>
<line x1="80" y1="419.5" x2="960" y2="419.5" stroke="#D9D4C7" stroke-width="1"/>

<text class="m" x="90" y="462" font-size="14" fill="#5E5B54">00:21</text>
<text class="m cap" x="160" y="462" font-size="12.5" fill="#5E5B54">Agent</text>
<text class="t" x="290" y="462" font-size="21" fill="#111110">Have you had a fever or chills since the procedure?</text>
<line x1="80" y1="490.5" x2="960" y2="490.5" stroke="#D9D4C7" stroke-width="1"/>

<rect x="80" y="491" width="880" height="68" fill="#EAE6DC"/>
<text class="m" x="90" y="532" font-size="14" fill="#5E5B54">00:29</text>
<text class="m cap" x="160" y="532" font-size="12.5" fill="#111110">Patient</text>
<text class="t" x="290" y="532" font-size="21" fill="#111110">I took my temperature this morning. It was <tspan fill="#FF4F00">101.8</tspan>.</text>
<line x1="80" y1="559.5" x2="960" y2="559.5" stroke="#D9D4C7" stroke-width="1"/>

<text class="m" x="90" y="602" font-size="14" fill="#5E5B54">00:38</text>
<text class="m cap" x="160" y="602" font-size="12.5" fill="#5E5B54">Agent</text>
<text class="t" x="290" y="602" font-size="21" fill="#111110">Thank you. I’m flagging this for your doctor now,</text>
<text class="t" x="290" y="632" font-size="21" fill="#111110">and they’ll be in touch with you today.</text>
<line x1="80" y1="660.5" x2="960" y2="660.5" stroke="#D9D4C7" stroke-width="1"/>

<!-- Triage -->
<text class="s" x="1040" y="186" font-size="28" font-weight="600" letter-spacing="-0.6" fill="#111110">Triage</text>
<text class="m cap" x="1520" y="186" font-size="12.5" fill="#5E5B54" text-anchor="end">Urgency</text>
<line x1="1040" y1="213.5" x2="1520" y2="213.5" stroke="#111110" stroke-width="1.5"/>

<path d="M1438 236 L1452 236 L1445 245 Z" fill="#FF4F00"/>
<rect x="1040.75" y="252.75" width="148.5" height="42.5" fill="#F4F1EA" stroke="#D9D4C7" stroke-width="1.5"/>
<text class="m cap" x="1115" y="279" font-size="12.5" fill="#5E5B54" text-anchor="middle">Low</text>
<rect x="1205.75" y="252.75" width="148.5" height="42.5" fill="#F4F1EA" stroke="#D9D4C7" stroke-width="1.5"/>
<text class="m cap" x="1280" y="279" font-size="12.5" fill="#5E5B54" text-anchor="middle">Medium</text>
<rect x="1370" y="252" width="150" height="44" fill="#FF4F00"/>
<text class="m cap" x="1445" y="279" font-size="12.5" fill="#F4F1EA" text-anchor="middle">High</text>
<text class="m" x="1040" y="324" font-size="12.5" fill="#5E5B54">routine</text>
<text class="m" x="1205" y="324" font-size="12.5" fill="#5E5B54">next-day review</text>
<text class="m" x="1370" y="324" font-size="12.5" fill="#111110">doctor now</text>
<line x1="1040" y1="350.5" x2="1520" y2="350.5" stroke="#D9D4C7" stroke-width="1"/>

<text class="m cap" x="1040" y="392" font-size="15" fill="#5E5B54">Signals</text>
<rect x="1040" y="420" width="10" height="10" fill="#FF4F00"/>
<text class="m cap" x="1064" y="430" font-size="14" letter-spacing="1.2" fill="#111110">Incision</text>
<text class="m" x="1210" y="430" font-size="14" fill="#5E5B54">warm, red, more swollen</text>
<line x1="1040" y1="444.5" x2="1520" y2="444.5" stroke="#D9D4C7" stroke-width="1"/>
<rect x="1040" y="458" width="10" height="10" fill="#FF4F00"/>
<text class="m cap" x="1064" y="468" font-size="14" letter-spacing="1.2" fill="#111110">Fever</text>
<text class="m" x="1210" y="468" font-size="14" fill="#5E5B54">101.8 °F on day 3</text>
<line x1="1040" y1="482.5" x2="1520" y2="482.5" stroke="#D9D4C7" stroke-width="1"/>
<rect x="1040" y="496" width="10" height="10" fill="#FF4F00"/>
<text class="m cap" x="1064" y="506" font-size="14" letter-spacing="1.2" fill="#111110">Trend</text>
<text class="m" x="1210" y="506" font-size="14" fill="#5E5B54">worse than yesterday</text>
<line x1="1040" y1="520.5" x2="1520" y2="520.5" stroke="#D9D4C7" stroke-width="1"/>

<text class="m cap" x="1040" y="574" font-size="15" fill="#5E5B54">Grounded in</text>
<text class="m" x="1040" y="606" font-size="14" fill="#111110">Consultation notes: call if fever</text>
<text class="m" x="1040" y="630" font-size="14" fill="#111110">over 100.4 °F or redness spreads.</text>
<line x1="1040" y1="660.5" x2="1520" y2="660.5" stroke="#D9D4C7" stroke-width="1"/>

<!-- Escalation -->
<line x1="80" y1="716.5" x2="1520" y2="716.5" stroke="#111110" stroke-width="1"/>
<text class="m cap" x="80" y="764" font-size="15" fill="#5E5B54">Escalation, when urgency is high</text>
<text class="s" x="72" y="912" font-size="118" font-weight="600" letter-spacing="-4" fill="#111110">SMS <tspan fill="#FF4F00">→</tspan> Doctor</text>

<text class="m cap" x="1100" y="764" font-size="15" fill="#5E5B54">Text message · 00:47</text>
<rect x="1100.75" y="788.75" width="418.5" height="150.5" fill="#F4F1EA" stroke="#111110" stroke-width="1.5"/>
<rect x="1100" y="788" width="6" height="152" fill="#FF4F00"/>
<text class="m" x="1128" y="824" font-size="14.5" fill="#111110">AuraHealth · <tspan fill="#FF4F00">HIGH</tspan> urgency</text>
<text class="m" x="1128" y="854" font-size="14.5" fill="#5E5B54">Post-op day 3. Incision warm</text>
<text class="m" x="1128" y="878" font-size="14.5" fill="#5E5B54">and red, fever 101.8 °F.</text>
<text class="m" x="1128" y="908" font-size="14.5" fill="#111110">Flagged on your dashboard.</text>
<text class="m" x="1520" y="972" font-size="12" fill="#5E5B54" text-anchor="end">Illustrative call, not patient data.</text>
</svg>
