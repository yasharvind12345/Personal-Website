<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">Cortexa: token-level entropy over a generated sentence</title>
<desc id="d">A generated sentence, "Our refund policy allows returns within 30 days, extended to 90 days for enterprise plans.", with a per-token entropy chart above it. Two tokens, "90" and "enterprise", rise above the 2.5-nat threshold and are flagged as likely hallucinations. Illustrative output.</desc>
